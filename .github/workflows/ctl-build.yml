name: ctl-build
# The engine's full control-layer test set, built from source on the runner: each job checks out the public
# Mircoguidetti/fenvix-engine at the requested commit (no token), builds mongo-server and pq (ci/build-engine.sh, build
# output kept off the logs), and runs its share of ctl-tests. No binary leaves the runners: the artifacts and the
# results branch results/<7-char commit>/<run id> hold only results, pytest logs, server logs and build.json (sha256s).
# Starts on: workflow_dispatch, or a push to main by the repository owner (the commit in default-engine-commit.txt).
on:
  workflow_dispatch:
    inputs:
      engine_commit:
        description: "Engine commit (full sha preferred)"
        required: true
      mode:
        description: "Full set: sealed2-derive, off, both, or none (repeats only)"
        required: false
        default: "both"
      jobs:
        description: "Parallel jobs per mode"
        required: false
        default: "10"
      files:
        description: "Only these test files, space separated (empty: all)"
        required: false
        default: ""
      repeats:
        description: "Repeat runs, in parallel: FILE:RUNS:MODE,... (MODE sealed2-derive, off or both), e.g. test_05_erase:5:both"
        required: false
        default: ""
      repeat_jobs:
        description: "Most jobs one repeat item is spread over (default 10)"
        required: false
        default: "10"
      unit_tests:
        description: "Cargo unit tests of the engine's root package, each N times in one job: FILTER:RUNS,... (e.g. compactor_tests::some_test:5)"
        required: false
        default: ""
      lib_suite_runs:
        description: "Runs of the whole lib unit suite (cargo test --release -p <root package> --lib), one per parallel job (empty or 0: none)"
        required: false
        default: ""
      lib_suite_filter:
        description: "Optional cargo test name filter for the lib suite runs (e.g. gc); empty = the whole suite"
        required: false
        default: ""
      lib_suite_timeout:
        description: "Timeout of one lib suite run, seconds (the build is not counted)"
        required: false
        default: "1200"
      test_env:
        description: "Extra environment for the ctl tests, space separated NAME=VALUE (names in capitals, e.g. CTL82_CONTROL=1)"
        required: false
        default: ""
      extra_tests:
        description: "Folder under extra-tests/ in this repo whose test_*.py files are copied into ctl-tests for this run (empty: none)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write

env:
  ENGINE_REPO: Mircoguidetti/fenvix-engine
  RUST_VERSION: "1.97.0"

jobs:
  plan:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.p.outputs.commit }}
      name: ${{ steps.p.outputs.name }}
      matrix: ${{ steps.p.outputs.matrix }}
      libruns: ${{ steps.l.outputs.libruns }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - id: c
        env: { IN_COMMIT: "${{ inputs.engine_commit }}" }
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then C="$IN_COMMIT"
          elif [ -s default-engine-commit.txt ]; then C=$(tr -d ' \n' < default-engine-commit.txt)
          else C=""; fi
          echo "commit=$C" >> "$GITHUB_OUTPUT"
      - if: steps.c.outputs.commit != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ steps.c.outputs.commit }}
          path: engine
          persist-credentials: false
          sparse-checkout: ctl-tests
      - name: extra tests
        if: inputs.extra_tests != ''
        env: { X: "${{ inputs.extra_tests }}" }
        run: |
          set -euo pipefail
          case "$X" in *..*|/*) echo "bad extra_tests"; exit 1 ;; esac
          ls extra-tests/"$X"/test_*.py
          cp extra-tests/"$X"/test_*.py engine/ctl-tests/
      - id: p
        env:
          C: ${{ steps.c.outputs.commit }}
          IN_MODE: ${{ inputs.mode }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_FILES: ${{ inputs.files }}
          IN_REPEATS: ${{ inputs.repeats }}
          IN_REPEAT_JOBS: ${{ inputs.repeat_jobs }}
        run: |
          set -euo pipefail
          [ -n "$C" ] || { echo "no engine commit given and no default-engine-commit.txt: nothing to run"; echo "matrix=" >> "$GITHUB_OUTPUT"; exit 0; }
          FULL=$(git -C engine rev-parse HEAD)
          case "${IN_MODE:-both}" in off) MODES=off ;; sealed2-derive) MODES=sealed2-derive ;; none) MODES= ;; *) MODES=sealed2-derive,off ;; esac
          FILES=${IN_FILES:-$(cd engine/ctl-tests && ls test_*.py)}
          # every repeated file must exist at this commit
          for item in $(echo "${IN_REPEATS:-}" | tr ',' ' '); do f=${item%%:*}; f=${f%.py}; [ -f "engine/ctl-tests/$f.py" ] || { echo "repeat file $f.py is not in ctl-tests at this commit"; exit 1; }; done
          M=$(python3 ci/split.py --jobs "${IN_JOBS:-10}" --modes "$MODES" --repeats "${IN_REPEATS:-}" --repeat-jobs "${IN_REPEAT_JOBS:-10}" $FILES)
          echo "$M" | python3 -m json.tool
          { echo "commit=$FULL"; echo "name=${FULL:0:7}"; echo "matrix=$M"; } >> "$GITHUB_OUTPUT"

      - id: l
        env: { N: "${{ inputs.lib_suite_runs }}" }
        run: |
          set -euo pipefail
          case "${N:-0}" in ''|0) echo "libruns=" >> "$GITHUB_OUTPUT" ;; *[!0-9]*) echo "lib_suite_runs must be a number"; exit 1 ;;
            *) echo "libruns=$(python3 -c "import json,sys;print(json.dumps(list(range(1,int(sys.argv[1])+1))))" "$N")" >> "$GITHUB_OUTPUT" ;; esac

  ctl:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ctl ${{ matrix.mode }} ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ needs.plan.outputs.commit }}
          path: engine
          persist-credentials: false
      - name: rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal > /dev/null && rustup default "$RUST_VERSION" && rustc --version
      # only crates.io downloads are cached (public crates); never the engine's source or target
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('engine/Cargo.lock', 'engine/proto/quaderno/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.fenvix-judge
          key: judge-env-${{ hashFiles('ci/setup-env.sh') }}
      - name: build
        run: mkdir -p out && ci/build-engine.sh engine "${{ needs.plan.outputs.commit }}" out
      - run: ci/setup-env.sh
      - name: node driver (test_40)
        run: cd engine/mongo-tests/node && npm ci --silent
      - name: extra tests
        if: inputs.extra_tests != ''
        env: { X: "${{ inputs.extra_tests }}" }
        run: |
          set -euo pipefail
          case "$X" in *..*|/*) echo "bad extra_tests"; exit 1 ;; esac
          ls extra-tests/"$X"/test_*.py
          cp extra-tests/"$X"/test_*.py engine/ctl-tests/
      - name: tests
        env:
          CTL_DATA: ${{ runner.temp }}/ctl-data
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
          KIND: ${{ matrix.kind }}
          FILES: ${{ matrix.files }}
          TEST_ENV: ${{ inputs.test_env }}
        run: |
          # tests that need a memory cgroup (they import memcg.py) get one: this shell moves into a usable group
          need=0; for spec in $FILES; do f=engine/ctl-tests/${spec%%@*}.py; grep -qE '^from memcg import|^import memcg' "$f" 2>/dev/null && need=1; done
          if [ $need = 1 ]; then sudo ci/memcg-setup.sh $$ "$(id -un)"; fi
          for kv in $TEST_ENV; do
            case "$kv" in [A-Z]*=*) n=${kv%%=*}; case "$n" in *[!A-Z0-9_]*|GITHUB_*|RUNNER_*|AWS_*|PATH|HOME|LD_*) echo "test_env: $n not allowed"; exit 1 ;; esac; export "$kv"; echo "test_env: $n set" ;;
              *) echo "test_env: bad item"; exit 1 ;; esac
          done
          start=$(date +%s)
          S=$start python3 -c 'import json,os;json.dump({"mode":os.environ["MODE"],"shard":os.environ["SHARD"],"kind":os.environ["KIND"],"files":os.environ["FILES"],"start":int(os.environ["S"])},open("out/shard.json","w"))'
          ci/run-shard.sh engine "$MODE" out $FILES
          E=$(date +%s) python3 -c 'import json,os;m=json.load(open("out/shard.json"));m["end"]=int(os.environ["E"]);open("out/shard.json","w").write(json.dumps(m))'
      - name: server logs
        if: always()
        run: mkdir -p out/server && cp -r engine/ctl-tests/out/. out/server/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.mode }}-${{ matrix.shard }}
          path: out
          retention-days: 14

  unit:
    needs: plan
    if: needs.plan.outputs.commit != '' && inputs.unit_tests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ needs.plan.outputs.commit }}
          path: engine
          persist-credentials: false
      - name: rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal > /dev/null && rustup default "$RUST_VERSION" && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('engine/Cargo.lock', 'engine/proto/quaderno/Cargo.lock') }}
      - name: unit tests
        env: { SPEC: "${{ inputs.unit_tests }}" }
        run: ci/run-unit.sh engine "$PWD/unit" "$SPEC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit
          path: unit
          retention-days: 14

  libsuite:
    needs: plan
    if: needs.plan.outputs.commit != '' && needs.plan.outputs.libruns != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.libruns) }}
    name: lib suite ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ needs.plan.outputs.commit }}
          path: engine
          persist-credentials: false
      - name: rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal > /dev/null && rustup default "$RUST_VERSION" && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('engine/Cargo.lock', 'engine/proto/quaderno/Cargo.lock') }}
      - name: lib suite
        env: { RUN: "${{ matrix.run }}", TO: "${{ inputs.lib_suite_timeout }}", FILTER: "${{ inputs.lib_suite_filter }}" }
        run: ci/run-lib-suite.sh engine "$PWD/lib" "$RUN" "${TO:-1200}" "$FILTER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libsuite-${{ matrix.run }}
          path: lib
          retention-days: 14

  summary:
    needs: [plan, ctl, unit, libsuite]
    if: always() && !cancelled() && (needs.plan.outputs.matrix != '' || inputs.unit_tests != '' || needs.plan.outputs.libruns != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}" }
      - uses: actions/download-artifact@v4
        with: { path: shards }
      - name: summary
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.plan.outputs.name }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          export WALL_SECONDS=$(( $(date +%s) - $(date -d "$started" +%s) ))
          # built from source in every job: the manifest lists each job's toolchain and binaries' sha256 (all must agree)
          export BUNDLE_MANIFEST="$(echo "engine_commit: $COMMIT (built from source on each runner)"; for f in shards/*/build.json; do echo "$(basename "$(dirname "$f")"): $(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["rustc"],"| unstripped mongo-server",d.get("mongo_server_sha256_unstripped","-"),"pq",d.get("pq_sha256_unstripped","-"),"| stripped mongo-server",d["mongo_server_sha256"],"pq",d["pq_sha256"])' "$f")"; done)"
          python3 ci/summarize.py shards result > /dev/null
          if [ -f shards/unit/UNIT.md ]; then { echo; cat shards/unit/UNIT.md; } >> result/SUMMARY.md; mkdir -p result/unit; cp shards/unit/*.log shards/unit/unit.jsonl shards/unit/UNIT.md result/unit/ 2>/dev/null || true; fi
          if ls -d shards/libsuite-* > /dev/null 2>&1; then
            mkdir -p result/libsuite; cp shards/libsuite-*/lib_*.log shards/libsuite-*/lib.json result/libsuite/ 2>/dev/null || true
            for d in shards/libsuite-*/; do cp "$d/lib.json" "result/libsuite/lib_$(basename "$d" | sed 's/libsuite-//').json" 2>/dev/null || true; done
            rm -f result/libsuite/lib.json
            python3 - shards >> result/SUMMARY.md <<'PY'
          import glob, json, sys
          recs = sorted((json.load(open(f)) for f in glob.glob(sys.argv[1] + "/libsuite-*/lib.json")), key=lambda r: r["run"])
          if recs:
              p = sum(r["status"] == "pass" for r in recs)
              filt = recs[0].get("filter") or ""
              print(f"\n## lib unit suite (cargo test --release -p {recs[0]['package']} --lib{' -- ' + filt if filt else ''}), one run per job\n")
              print(f"- {p} of {len(recs)} PASS")
              for r in recs:
                  print(f"- run {r['run']}: {r['status'].upper()} in {r['seconds']} s | {r['result']}" + (f" | failed: {', '.join(r['failed'])}" if r['failed'] else ""))
          PY
          fi
          cat result/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          for d in shards/*/; do m=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["mode"])' "$d/shard.json" 2>/dev/null) || continue
            mkdir -p "result/logs/$m"; cp "$d"/ctl_*.log "result/logs/$m/" 2>/dev/null || true
            # the server logs (ctl-tests/out) go to the results branch too, so they can be read with git alone
            if [ -d "$d/server" ]; then mkdir -p "result/logs/$m/server/$(basename "$d")"; cp -r "$d/server/." "result/logs/$m/server/$(basename "$d")/"; fi; done
      - uses: actions/upload-artifact@v4
        with: { name: summary, path: result }
      - name: publish to results/<commit>/<run id>
        env: { NAME: "${{ needs.plan.outputs.name }}" }
        run: |
          set -euo pipefail
          cd result && git init -q && git checkout -q -b r
          git -c user.name=ctl-ci -c user.email=ctl-ci@users.noreply.github.com add -A
          git -c user.name=ctl-ci -c user.email=ctl-ci@users.noreply.github.com commit -q -m "ctl results: engine $NAME, run $GITHUB_RUN_ID"
          git push -q "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" "r:refs/heads/results/$NAME/$GITHUB_RUN_ID"
